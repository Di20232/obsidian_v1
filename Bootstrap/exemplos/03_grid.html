<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.demo { background: #cfe2ff; padding: 16px; text-align: center; border: 1px solid #6699ff; }</style>
</head>
<body>
    <div class="container mt-4">
        <h1>Grid System</h1>

        <h2>col-8 / col-4</h2>
        <div class="row mb-4">
            <div class="col-8"><div class="demo">col-8</div></div>
            <div class="col-4"><div class="demo">col-4</div></div>
        </div>

        <h2>Responsivo: col-12 / col-md-6 / col-lg-4</h2>
        <p>Redimensione a janela para ver mudando de 1 para 2 para 3 colunas.</p>
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-6 col-lg-4"><div class="demo">Card 1</div></div>
            <div class="col-12 col-md-6 col-lg-4"><div class="demo">Card 2</div></div>
            <div class="col-12 col-md-6 col-lg-4"><div class="demo">Card 3</div></div>
        </div>

        <h2>Centralizado</h2>
        <div class="row justify-content-center align-items-center" style="height: 150px; background: #eee;">
            <div class="col-4"><div class="demo">Centralizado</div></div>
        </div>
    </div>
</body>
</html>
