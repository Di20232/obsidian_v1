<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Utilitários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Classes Utilitárias</h1>

        <div class="d-flex justify-content-between align-items-center p-3 shadow-sm rounded mb-4">
            <strong>MeuLogo</strong>
            <button class="btn btn-primary">Ação</button>
        </div>

        <p class="text-primary">Texto azul (text-primary)</p>
        <p class="text-muted">Texto secundário (text-muted)</p>
        <div class="bg-light p-3 rounded mb-3">Fundo claro (bg-light)</div>

        <div class="d-none d-md-block bg-warning p-2 mb-2">Só aparece em telas médias/grandes (d-md-block)</div>
        <div class="d-block d-md-none bg-info p-2 mb-2">Só aparece em telas pequenas (d-md-none)</div>

        <div class="shadow p-3 rounded">Caixa com sombra e cantos arredondados</div>
    </div>
</body>
</html>
