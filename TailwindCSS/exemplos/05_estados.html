<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind - Estados e Dark Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-50 dark:bg-gray-800 space-y-6">
    <h1 class="text-3xl font-bold text-gray-800 dark:text-white">Estados e Dark Mode</h1>

    <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition-colors duration-300">
        Passe o mouse aqui
    </button>

    <button class="bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-white px-4 py-2 rounded" disabled>
        Desabilitado
    </button>

    <div class="group border rounded p-4 hover:bg-gray-100 max-w-sm">
        <h3 class="text-gray-800 font-semibold">Passe o mouse no card inteiro</h3>
        <p class="text-gray-500 group-hover:text-blue-600 transition-colors">
            Este texto muda de cor por causa do hover no card pai (group-hover).
        </p>
    </div>

    <div class="bg-white text-gray-900 dark:bg-gray-900 dark:text-white p-6 rounded shadow max-w-sm">
        Este card se adapta ao modo escuro do sistema (dark:).
    </div>
</body>
</html>
