<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posicionamento</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 20px; }

    .card {
        position: relative;
        width: 250px;
        padding: 20px;
        background: #f5f5f5;
        border: 1px solid #ccc;
        margin-bottom: 40px;
    }
    .selo {
        position: absolute;
        top: -10px;
        right: -10px;
        background: red;
        color: white;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 12px;
    }

    .barra-sticky {
        position: sticky;
        top: 0;
        background: #333;
        color: white;
        padding: 12px 20px;
        z-index: 10;
    }
    .conteudo-longo { padding: 20px; }
    .conteudo-longo p { margin-bottom: 300px; }
</style>
</head>
<body>
    <h1>Posicionamento</h1>

    <div class="card">
        Card com selo no canto (position: relative + absolute)
        <span class="selo">Novo</span>
    </div>

    <div class="barra-sticky">Esta barra gruda no topo ao rolar (position: sticky)</div>
    <div class="conteudo-longo">
        <p>Role a página para baixo e observe a barra acima grudando no topo.</p>
        <p>Continue rolando...</p>
        <p>Mais um pouco...</p>
    </div>
</body>
</html>
